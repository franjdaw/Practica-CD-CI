<main class="contenedor">
  <header>
    <h1>{{ titulo }}</h1>
    <p class="subtitulo">Práctica CI/CD con GitHub Actions · Francisco José Jiménez Núñez · 2º DAW</p>
  </header>

  <section class="tarjeta">
    <app-tarea-form (nuevaTarea)="servicio.agregar($event)" />
    <p class="contador">Pendientes: <strong>{{ servicio.pendientes() }}</strong></p>
    <app-lista-tareas
      [tareas]="servicio.tareas()"
      (alternar)="servicio.alternar($event)"
      (eliminar)="servicio.eliminar($event)"
    />
  </section>

  <footer>Desplegado automáticamente en GitHub Pages</footer>
</main>
